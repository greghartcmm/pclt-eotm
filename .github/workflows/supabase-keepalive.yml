name: Supabase Keep-Alive

# Supabase pauses free projects after ~7 days without activity. Reads alone
# did not prevent the pause warning, so this does a real write (idempotent
# upsert of a sentinel row in celebration_seen) and fails the run on any
# non-2xx response.

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to Supabase
        run: |
          curl -sf \
            -X POST \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "https://jkpgggdlpjhoojamnhrp.supabase.co/rest/v1/celebration_seen?on_conflict=token,winner_month" \
            -d "{\"token\":\"_keepalive\",\"winner_month\":\"_keepalive\"}"
          echo "Keep-alive write complete"
