<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOTM — Voting Closed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #023047;
    --navy-deep: #011f2e;
    --gold: #FFB703;
    --orange: #FB8500;
    --magenta: #E4007C;
    --cyan: #57C7E3;
    --muted: #A9C1D1;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--navy);
    font-family: var(--sans);
  }

  .topbar {
    height: 6px;
    width: 100%;
    display: flex;
  }
  .topbar span { flex: 1; height: 100%; }
  .topbar .seg-orange { background: var(--orange); }
  .topbar .seg-magenta { background: var(--magenta); }
  .topbar .seg-cyan { background: var(--cyan); }

  .screen {
    min-height: calc(100vh - 6px);
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255,183,3,0.06), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(2,48,71,0.4), transparent 70%),
      var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .content {
    max-width: 640px;
    text-align: center;
  }

  .eyebrow {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 36px;
    opacity: 0.85;
  }

  .icon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .icon-glow {
    position: relative;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-glow::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,183,3,0.25), transparent 70%);
    animation: pulse 3s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: no-preference) {
    .hourglass { animation: tilt 4s ease-in-out infinite; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  @keyframes tilt {
    0%, 40% { transform: rotate(0deg); }
    50% { transform: rotate(180deg); }
    90%, 100% { transform: rotate(180deg); }
  }

  .headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    line-height: 1.05;
    color: #ffffff;
    font-size: 56px;
    margin: 0;
  }

  .headline .accent {
    display: block;
    color: var(--gold);
    font-weight: 800;
  }

  .month-pill {
    display: inline-block;
    margin-top: 22px;
    padding: 6px 18px;
    border: 1px solid rgba(255,183,3,0.4);
    border-radius: 999px;
    color: var(--gold);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .body-copy {
    margin-top: 28px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  .body-copy strong {
    color: #E9F2F7;
    font-weight: 600;
  }

  .divider {
    width: 56px;
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    margin: 32px auto 0;
    opacity: 0.7;
  }

  @media (max-width: 520px) {
    .headline { font-size: 40px; }
    .body-copy { font-size: 15px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="seg-orange"></span>
    <span class="seg-magenta"></span>
    <span class="seg-cyan"></span>
  </div>

  <div class="screen">
    <div class="content">
      <div class="eyebrow">CoverMyMeds &middot; PCLT Team</div>

      <div class="icon-wrap">
        <div class="icon-glow">
          <svg class="hourglass" width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2h12M6 22h12M7 2c0 5 3 6.5 5 6.5S17 7 17 2M7 22c0-5 3-6.5 5-6.5S17 17 17 22" stroke="#FFB703" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.5 5.5c.6 1.2 1.5 1.8 2.5 1.8s1.9-.6 2.5-1.8" stroke="#FFB703" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <h1 class="headline">
        VOTING IS
        <span class="accent">CLOSED</span>
      </h1>

      <div class="month-pill">August 2026</div>

      <p class="body-copy">
        Stay tuned for the announcement of the winner of this<br>
        prestigious award&hellip;
      </p>

      <div class="divider"></div>
    </div>
  </div>

</body>
</html>
